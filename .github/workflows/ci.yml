# BeQuite CI - the pack is markdown + two installers, so CI checks exactly that.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: bq_check (rules as checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/bq_check.py

  install-bash:
    name: installer smoke test (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install into an empty project
        run: |
          set -euo pipefail
          proj="$(mktemp -d)"
          cd "$proj"
          bash "$GITHUB_WORKSPACE/scripts/install-bequite.sh" --from-local "$GITHUB_WORKSPACE"
          test -f .claude/commands/bequite.md
          test -d .claude/skills/bequite-orchestrator
          test -f .bequite/state/WORKFLOW_GATES.md
          echo "commands: $(ls .claude/commands/*.md | wc -l)  skills: $(ls -d .claude/skills/bequite-*/ | wc -l)"

  install-powershell:
    name: installer smoke test (irm | iex path)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer the way `irm | iex` does
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ps1 = Join-Path $env:GITHUB_WORKSPACE 'scripts\install-bequite.ps1'
          # Decode bytes WITHOUT stripping a BOM - this is what irm hands to iex.
          $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($ps1))
          $proj = Join-Path $env:RUNNER_TEMP 'bq-proj'
          New-Item -ItemType Directory -Force $proj | Out-Null
          Set-Location $proj
          $env:BEQUITE_FROM_LOCAL = $env:GITHUB_WORKSPACE
          $out = ($text | Invoke-Expression) 2>&1 | Out-String
          if ($out -match 'CommandNotFound|is not recognized') { Write-Error "iex path broke:`n$out" }
          if (-not (Test-Path '.claude\commands\bequite.md')) { Write-Error 'commands not installed' }
          if (-not (Test-Path '.bequite\state\WORKFLOW_GATES.md')) { Write-Error 'memory scaffold missing' }
          Write-Host "irm|iex install OK"
